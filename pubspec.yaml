name: connectme_app
description: "ConnectMe: a Flutter community app with Firebase auth, a live Firestore feed, a fingerprint-protected profile and a members map, built with Clean Architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  google_fonts: ^9.0.0
  shared_preferences: ^2.5.6
  local_auth: ^3.0.2
  device_info_plus: ^13.3.0
  image_picker: ^1.2.4
  google_maps_flutter: ^2.19.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
